# Backup copy of the site on GitHub Pages: https://vicuvi1.github.io/personal_CV_page/
# Runs on every push to main, alongside the Vercel deploy. If Vercel ever goes away,
# this copy keeps the CV online.
name: Backup on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only the website files, not the repo tooling
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html content.js robots.txt assets .well-known _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
